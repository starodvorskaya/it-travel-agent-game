function st(){return `<div class=stats><div class=stat><b>💰 ${money(s.cash)}</b>касса</div><div class=stat><b>❤️ ${s.rep}</b>репутация</div><div class=stat><b>⭐ ${s.exp}</b>опыт</div><div class=stat><b>😵 ${s.stress}</b>стресс</div></div>`}
function r(x,p){app.innerHTML=top(p)+x}
function start(){s={cash:500000,rep:75,exp:0,stress:0,clients:0,errors:0,solved:0,hero:null,pass:null};r(`<div class="card hero"><div class=big>👩‍💼</div><h1>ВЫЖИВИ В ТУРИЗМЕ</h1><p>Ты — турагент IT.TRAVEL. Клиенты хотят идеальный отпуск, а авиакомпании, отели, документы, налоги и дедлайны хотят обратного.</p><button class=teal onclick=choose()>НАЧАТЬ РАБОЧИЙ ДЕНЬ</button><div class=muted>Все клиенты и документы вымышлены.</div></div>`,0)}
function choose(){r(`<h1>👤 Выбери турагента</h1><p>У каждого свой опыт, стиль общения и стрессоустойчивость.</p><div class=grid>${C.map((c,i)=>`<button class=choice onclick=pick(${i})><div style="font-size:32px">${c[3]}</div><b>${c[0]}, ${c[1]}</b><div class=muted>${c[2]}</div><p>🧠 Опыт ${c[4]} · 💬 Общение ${c[5]} · 😵 Стресс ${c[6]}</p></button>`).join("")}</div>`,8)}
function pick(i){let c=C[i];s.hero=c;s.exp=c[4];s.stress=c[6];morning()}
function morning(){r(st()+`<div class=card><span class=tag>09:00 · ДЕНЬ 1</span><h1>☕ Доброе утро, ${s.hero[0]}!</h1><p>Сегодня: 8 активных клиентов, 4 вылета и 7 бронирований.</p><p><b>Главная задача:</b> сохранить деньги, клиентов и остатки нервной системы.</p></div><button class=teal onclick=client()>НАЧАТЬ РАБОТУ</button>`,15)}
function client(){s.clients++;r(st()+`<div class=card><span class=tag>🔴 СРОЧНО</span><h1>🪪 Ошибка в паспорте</h1><p>Анна Петрова вылетает сегодня. В заявке одна буква в фамилии отличается от паспорта.</p></div><button class=choice onclick=passport()>Проверить документы</button><button class=choice onclick=badChoice()>🙈 Не проверять</button>`,23)}
function passport(){s.pass=P[0];r(st()+`<div class=card><h2>Паспорт туриста</h2><div class=row><span>Фамилия</span><b>${s.pass[0]}</b></div><div class=row><span>Имя</span><b>${s.pass[1]}</b></div><div class=row><span>Дата рождения</span><b>${s.pass[2]}</b></div><div class=row><span>Номер</span><b>${s.pass[3]}</b></div></div><div class=card><label>Фамилия</label><input id=a><label>Имя</label><input id=b><label>Дата рождения</label><input id=c><label>Номер паспорта</label><input id=d><button class=teal onclick=check()>ПРОВЕРИТЬ БРОНИРОВАНИЕ</button></div>`,30)}
function check(){if(a.value.toUpperCase().trim()==s.pass[0]&&b.value.toUpperCase().trim()==s.pass[1]&&c.value.trim()==s.pass[2]&&d.value.trim()==s.pass[3]){s.rep+=5;s.exp+=8;s.solved++;r(st()+`<div class="card ok"><h2>✅ Всё верно</h2><p>Ты заметил ошибку до подтверждения бронирования.</p></div><button class=teal onclick=miss()>ДАЛЬШЕ</button>`,36)}else{s.errors++;s.rep-=8;s.stress+=8;r(st()+`<div class="card bad"><b>❌ Данные не совпадают.</b><p>Проверь каждую букву и цифру.</p></div><button onclick=passport()>ИСПРАВИТЬ</button>`,30)}}
function badChoice(){s.errors++;s.rep-=15;s.stress+=12;miss()}
function miss(){r(st()+`<div class=card><span class=tag>10:17</span><h1>✈️ Турист проспал вылет</h1><p>Рейс уже улетел. Клиент звонит: «Я стою в аэропорту. Что теперь?!»</p></div><button class=choice onclick=act(45000,8,15,8)>🎫 Купить новый билет<br><span class=muted>−45 000 ₽ · быстро</span></button><button class=choice onclick=act(0,3,8,22)>📞 Связаться с авиакомпанией<br><span class=muted>бесплатно · есть риск</span></button><button class=choice onclick=act(1000,10,12,-5)>💚 Позвать коллегу IT.TRAVEL<br><span class=muted>−1 000 ₽ · помощь команды</span></button><button class=choice onclick=act(0,-25,-5,35)>🙃 Сказать, что это проблема клиента<br><span class=muted>0 ₽ · репутация −25</span></button>`,45)}
function act(cost,rep,exp,stress){s.cash-=cost;s.rep+=rep;s.exp+=exp;s.stress+=stress;s.solved++;if(fail())lose();else business()}
function business(){r(st()+`<div class=card><span class=tag>12:05 · БИЗНЕС</span><h1>🧾 НДС изменился</h1><p>Расходы агентства растут. Как сохранить прибыльность?</p></div><button class=choice onclick=biz(-15000,3,8)>📣 Сократить рекламные расходы<br><span class=muted>экономия денег, меньше заявок</span></button><button class=choice onclick=biz(0,-6,7)>💸 Поднять цены для новых клиентов<br><span class=muted>маржа выше, риск недовольства</span></button><button class=choice onclick=biz(-25000,7,12)>🤝 Переговорить с поставщиками<br><span class=muted>вложить деньги сейчас</span></button><button class=choice onclick=biz(-5000,8,18)>💚 Позвать старшего менеджера<br><span class=muted>вместе пересчитать модель</span></button>`,57)}
function biz(cost,rep,exp){s.cash-=cost;s.rep+=rep;s.exp+=exp;s.solved++;if(fail())lose();else multi()}
function multi(){r(st()+`<div class=card><span class=tag>14:40 · 3 ЧАТА</span><h1>📞 Все хотят вас одновременно</h1><p>Выберите, кому отвечать первым.</p></div><button class=choice onclick=multiAct(0,5,8)>🔴 Вылет через 40 минут</button><button class=choice onclick=multiAct(0,2,15)>🟡 Новый запрос на дорогой тур</button><button class=choice onclick=multiAct(0,3,12)>🟢 Постоянный клиент</button>`,68)}
function multiAct(cost,rep,stress){s.cash-=cost;s.rep+=rep;s.stress+=stress;s.solved++;if(fail())lose();else final()}
function final(){s.pass=P[1];r(st()+`<div class=card><span class=tag>18:45 · ФИНАЛ</span><h1>🏨 Отель отменил бронь</h1><p>Туристы должны заселиться завтра. Клиент требует решение сейчас.</p></div><button class=choice onclick=finish(-30000,8,15)>🏨 Забронировать альтернативу<br><span class=muted>−30 000 ₽</span></button><button class=choice onclick=finish(-5000,4,20)>📞 Торговаться с отелем<br><span class=muted>−5 000 ₽</span></button><button class=choice onclick=finish(-1000,10,5)>💚 Подключить команду IT.TRAVEL<br><span class=muted>−1 000 ₽</span></button>`,85)}
function finish(cost,rep,stress){s.cash+=cost;s.rep+=rep;s.stress+=stress;s.solved++;fail()?lose():win()}
function fail(){return s.cash<300000||s.rep<=25||s.stress>=95}
function win(){let score=Math.max(0,Math.min(100,Math.round(s.rep*.5+s.exp*.35+(100-s.stress)*.15)));let rank=score>=90?"TRAVEL MASTER 👑":score>=75?"SENIOR TRAVEL MANAGER ⭐":score>=60?"TRAVEL MANAGER ✈️":"TRAVEL AGENT";r(`<div class="card hero"><div class=big>🎉</div><h1>УРА! ТЫ ВЫЖИЛ В ТУРИЗМЕ!</h1><div class=score>${score}/100</div><h2>${rank}</h2><p>Клиентов: ${s.clients+2} · Проблем решено: ${s.solved} · Ошибок: ${s.errors}</p></div>${st()}<div class=card><p>Ты пережил отмену вылета, документы, несколько клиентов одновременно и изменение НДС.</p><p><b>Теперь решать тебе.</b></p><p>✈️ Доверить путешествие профессионалам или 🎓 научиться создавать такие путешествия самому и стать частью IT.TRAVEL.</p><button class=teal onclick=help()>💚 IT.TRAVEL</button><button class=alt onclick=start()>🔄 ПРОЙТИ ЕЩЁ РАЗ</button></div>`,100)}
function lose(){r(`<div class="card hero"><div class=big>💀</div><h1>ТЫ НЕ ВЫЖИЛ В ТУРИЗМЕ</h1><p>Турист проспал самолёт. Отель отменил бронь. Клиент требует решение. А НДС решил добить тебя окончательно.</p>${st()}<p>Но теперь ты хотя бы знаешь, что работа турагента — это не просто «найти тур подешевле» 😂</p><button class=teal onclick=help()>💚 IT.TRAVEL, СПАСАЙ</button><button class=alt onclick=start()>🔄 ПОПРОБОВАТЬ ЕЩЁ РАЗ</button></div>`,100)}
function help(){r(`<div class="card hero"><div class=big>💚</div><h1>IT.TRAVEL</h1><p><b>Попробуй выжить в туризме. А потом реши — доверить путешествия нам или стать одним из нас.</b></p><button class=teal onclick="alert('Здесь будет ссылка на IT.TRAVEL')">✈️ ДОВЕРИТЬ ПУТЕШЕСТВИЕ КОМАНДЕ</button><button class=teal onclick="alert('Здесь будет ссылка на школу туризма IT.TRAVEL')">🎓 НАУЧИТЬСЯ И СТАТЬ ЧАСТЬЮ IT.TRAVEL</button><button class=alt onclick=start()>Вернуться в игру</button></div>`,100)}
start();
</script>
